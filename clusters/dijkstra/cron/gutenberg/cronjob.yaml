apiVersion: batch/v1
kind: CronJob
metadata:
  name: gutenberg
  namespace: cron
spec:
  schedule: "0 18 * * 1"
  timeZone: Europe/Warsaw
  # runs missed during downtime are not caught up; the boot-time job covers reboots
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # also cleans up manually created jobs (kubectl create job --from=cronjob/gutenberg)
      ttlSecondsAfterFinished: 259200
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: regis
          restartPolicy: Never
          volumes:
            - name: books
              persistentVolumeClaim:
                claimName: gutenberg-books-pvc
            - name: scripts
              configMap:
                name: gutenberg-scripts
                defaultMode: 0755
          containers:
            - name: gutenberg
              image: alpine:3.20
              command:
                - sh
                - -c
                - apk add --no-cache rsync bash coreutils findutils exiftool perl-archive-zip jq && /scripts/run.sh
              volumeMounts:
                - name: books
                  mountPath: /data
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 1000m
