apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shani-home-pvc
  namespace: shani
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  volumeMode: Filesystem
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: projects-pvc
  namespace: shani
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  volumeMode: Filesystem
  resources:
    requests:
      storage: 500Gi
  volumeName: projects-pv
