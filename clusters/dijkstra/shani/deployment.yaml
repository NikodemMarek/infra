apiVersion: apps/v1
kind: Deployment
metadata:
  name: shani
  namespace: shani
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shani
  template:
    metadata:
      labels:
        app: shani
    spec:
      hostname: shani
      nodeSelector:
        kubernetes.io/hostname: triss
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home-shani
          persistentVolumeClaim:
            claimName: shani-home-pvc
        - name: projects
          persistentVolumeClaim:
            claimName: projects-pvc
        - name: secrets
          secret:
            secretName: secrets
            defaultMode: 0400
      containers:
        - name: shani
          image: shani:6psv59gbrx3gfnb5a2i559fr9jnvjs36
          imagePullPolicy: Never
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home-shani
              mountPath: /home/shani
            - name: projects
              mountPath: /projects
            - name: secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "3"
              memory: "6Gi"
              ephemeral-storage: "4Gi"
