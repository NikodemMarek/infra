apiVersion: apps/v1
kind: Deployment
metadata:
  name: shani
  namespace: shani
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shani
  template:
    metadata:
      labels:
        app: shani
    spec:
      nodeSelector:
        kubernetes.io/hostname: triss
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home-shani
          persistentVolumeClaim:
            claimName: shani-home-pvc
        - name: host-ssh-key
          secret:
            secretName: secrets
            defaultMode: 0400
      containers:
        - name: shani
          image: shani:zvhkjgv7jhi404sc7d3b8l4l6f877nxk
          imagePullPolicy: Never
          ports:
            - containerPort: 2222
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home-shani
              mountPath: /home/shani
            - name: host-ssh-key
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
