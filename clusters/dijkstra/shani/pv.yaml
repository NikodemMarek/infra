apiVersion: v1
kind: PersistentVolume
metadata:
  name: projects-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    server: 100.100.215.91
    path: /mnt/projects
  mountOptions:
    - nfsvers=4.2
    - noatime
    - nocto
    - actimeo=60
