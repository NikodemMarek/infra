apiVersion: v1
kind: PersistentVolume
metadata:
   name: ollama-models-pv
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
   server: 100.100.215.91
   path: /mnt/models
  mountOptions:
    - actimeo=300
    - noatime
    - nodiratime
