apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiomuse-ai
  namespace: navidrome
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
      sectionName: internal
  hostnames:
    - "audiomuse-ai.nkmrk.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: audiomuse-ai
          port: 80
