apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: audiomuse-ai-repo
  namespace: navidrome
spec:
  interval: 10m0s
  url: https://NeptuneHub.github.io/AudioMuse-AI-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiomuse-ai-release
  namespace: navidrome
spec:
  chart:
    spec:
      chart: audiomuse-ai
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: audiomuse-ai-repo
      version: v1.1.6
  interval: 10m0s
  values:
    image:
      tag: "3.6.4"
    postgres:
      enabled: false
      external:
        host: audiomuse-postgres-rw
      existingSecret: audiomuse-postgres-app
      existingSecretKeys:
        user: username
        password: password
        db: dbname
    flask:
      service:
        type: ClusterIP
      nodeSelector:
        kubernetes.io/hostname: regis
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    worker:
      nodeSelector:
        kubernetes.io/hostname: regis
      resources:
        requests:
          cpu: 250m
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 3Gi
