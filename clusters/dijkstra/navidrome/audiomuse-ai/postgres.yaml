apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: audiomuse-postgres
  namespace: navidrome
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5efb66993894055f0aa50bd94337c6c4ff2e2129f4d433c527151aebbf283fb0
  bootstrap:
    initdb:
      database: audiomuse
      owner: audiomuse
      dataChecksums: true
  storage:
    storageClass: openebs-zfs
    size: 5Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: regis
  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 1000m
  inheritedMetadata:
    annotations:
      # Velero copies the PVC files while postgres is running, so the copied
      # PGDATA is not consistent: restore only from this dump
      pre.hook.backup.velero.io/container: postgres
      pre.hook.backup.velero.io/command: '["/bin/sh","-c","pg_dump -Fc -d audiomuse -f /var/lib/postgresql/data/audiomuse.dump.tmp && mv /var/lib/postgresql/data/audiomuse.dump.tmp /var/lib/postgresql/data/audiomuse.dump"]'
      pre.hook.backup.velero.io/on-error: Fail
      pre.hook.backup.velero.io/timeout: 10m
