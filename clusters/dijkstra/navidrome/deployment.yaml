apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
  labels:
    app: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      nodeSelector:
        kubernetes.io/hostname: regis
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data-pvc
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music-pvc
      initContainers:
        - name: get-plugins
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/plugins
              wget -O /data/plugins/audiomuseai.ndp https://github.com/NeptuneHub/AudioMuse-AI-NV-plugin/releases/download/v10/audiomuseai.ndp
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "16Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "200m"
      containers:
        - name: navidrome
          image: deluan/navidrome:latest
          ports:
            - containerPort: 4533
          env:
            - name: ND_ENABLEINSIGHTSCOLLECTOR
              value: "false"
            - name: ND_PROMETHEUS_ENABLED
              value: "true"
            - name: ND_LOGLEVEL
              value: "info"
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_DATAFOLDER
              value: "/data"
            - name: ND_PLUGINS_ENABLED
              value: "true"
            - name: ND_PLUGINS_AUTORELOAD
              value: "true"
            - name: ND_AGENTS
              value: "audiomuseai,lastfm,spotify,deezer"
            - name: ND_DEVARTISTINFOTIMETOLIVE
              value: "1s"
            # Server and scanner subprocess each inherit this; without it their
            # heaps grow past the container limit right after startup.
            - name: GOMEMLIMIT
              value: "400MiB"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "30m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
