apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-policy
  namespace: velero
data:
  policy.yaml: |
    version: v1
    volumePolicies:
      - conditions:
          storageClass:
            - local-storage
            - nfs
        action:
          type: skip
      - conditions:
          volumeTypes:
            - emptyDir
        action:
          type: skip
      - conditions:
          pvcLabels:
            backup: skip
        action:
          type: skip
