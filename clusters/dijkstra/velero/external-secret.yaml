apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: velero
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: secrets
    creationPolicy: Orphan
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        cloud: |
          [default]
          aws_access_key_id = {{ .access_key_id }}
          aws_secret_access_key = {{ .secret_access_key }}
  data:
    - secretKey: access_key_id
      remoteRef:
        key: velero/access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: velero/secret_access_key
