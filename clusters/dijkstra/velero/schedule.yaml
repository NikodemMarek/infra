apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-openebs
  namespace: velero
spec:
  schedule: "CRON_TZ=Europe/Warsaw 0 18 * * *"
  template:
    ttl: 720h0m0s
    defaultVolumesToFsBackup: true
    snapshotVolumes: false
    includedNamespaces:
      - "*"
    excludedNamespaces:
      - kube-system
      - velero
      - flux-system
    # secrets come from Bitwarden via cluster-secrets-build
    excludedResources:
      - secrets
    resourcePolicy:
      kind: configmap
      name: volume-policy
