apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: velero
  namespace: velero
spec:
  interval: 1h
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 1h
  chart:
    spec:
      chart: velero
      version: "12.2.5"
      sourceRef:
        kind: HelmRepository
        name: velero
        namespace: velero
  values:
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    credentials:
      existingSecret: secrets
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: velero
          default: true
          config:
            region: garage
            s3ForcePathStyle: "true"
            s3Url: http://100.100.215.91:3900
      repositoryMaintenanceJob:
        repositoryConfigData:
          global:
            keepLatestMaintenanceJobs: 3
            podResources:
              cpuRequest: "0"
              cpuLimit: "0"
              memoryRequest: 256Mi
              memoryLimit: 1Gi
            loadAffinity:
              - nodeSelector:
                  matchLabels:
                    kubernetes.io/hostname: triss
    nodeSelector:
      kubernetes.io/hostname: triss
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    snapshotsEnabled: false
    deployNodeAgent: true
    nodeAgent:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 1Gi
