apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
  namespace: dns
  labels:
    app: dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns
  template:
    metadata:
      labels:
        app: dns
    spec:
      nodeSelector:
        kubernetes.io/hostname: triss
      volumes:
        - name: corefile
          configMap:
            name: dns-corefile
      containers:
        - name: coredns
          image: coredns/coredns:1.15.0
          args: ["-conf", "/etc/coredns/Corefile"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
          volumeMounts:
            - name: corefile
              mountPath: /etc/coredns
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
