apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: dns
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "dns"
    tailscale.com/tags: "tag:dns"
spec:
  selector:
    app: dns
  ports:
    - name: dns
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
