apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-corefile
  namespace: dns
data:
  Corefile: |
    (upstream) {
        forward . tls://194.242.2.2 {
            tls_servername dns.mullvad.net
        }
        cache 300
    }
    vpn.nkmrk.com {
        errors
        import upstream
    }
    nkmrk.com {
        errors
        template IN A nkmrk.com {
            match "(?i)^[a-z0-9-]+\.nkmrk\.com\.$"
            answer "{{ .Name }} 60 IN A 100.97.10.25"
            fallthrough
        }
        template ANY ANY nkmrk.com {
            match "(?i)^[a-z0-9-]+\.nkmrk\.com\.$"
            authority "nkmrk.com. 60 IN SOA ns.nkmrk.com. hostmaster.nkmrk.com. 1 7200 1800 86400 60"
            fallthrough
        }
        import upstream
    }
    shani.nkmrk.com {
        errors
        rewrite name exact shani.nkmrk.com. shani-service.shani.svc.cluster.local. answer auto
        forward . 10.43.0.10
    }
    radicale.nkmrk.com sonarr.nkmrk.com radarr.nkmrk.com lidarr.nkmrk.com qbittorrent.nkmrk.com bazarr.nkmrk.com prowlarr.nkmrk.com ollama.nkmrk.com audiomuse-ai.nkmrk.com omniverse.nkmrk.com photos.nkmrk.com {
        errors
        rewrite name regex .* traefik-internal.default.svc.cluster.local. answer auto
        forward . 10.43.0.10
    }
    cluster.local {
        errors
        forward . 10.43.0.10
        cache 30
    }
    . {
        errors
        health :8080
        ready :8181
        reload
        import upstream
    }
