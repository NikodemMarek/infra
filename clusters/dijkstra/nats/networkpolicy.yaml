apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats
  namespace: nats
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wireguard
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 7422
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shani
      ports:
        - protocol: TCP
          port: 4222
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix
          podSelector:
            matchLabels:
              app: matrix-gateway
      ports:
        - protocol: TCP
          port: 4222
