apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: matrix
data:
  homeserver.yaml: |
    server_name: nkmrk.com
    public_baseurl: https://matrix.nkmrk.com/
    pid_file: /data/homeserver.pid
    signing_key_path: /data/nkmrk.com.signing.key
    media_store_path: /data/media_store

    listeners:
      - port: 8008
        type: http
        tls: false
        x_forwarded: true
        bind_addresses: ['0.0.0.0']
        resources:
          - names: [client]
            compress: false

    serve_client_wellknown: true

    federation_domain_whitelist: []
    trusted_key_servers: []
    suppress_key_server_warning: true

    enable_registration: false
    registration_shared_secret_path: /secrets/registration_shared_secret

    report_stats: false
    presence:
      enabled: false
    push:
      include_content: false

    retention:
      enabled: true
    media_retention:
      local_media_lifetime: 365d

    rc_message:
      per_second: 5
      burst_count: 50

    database:
      name: psycopg2
      args:
        host: matrix-postgres-rw
        user: synapse
        dbname: synapse
        cp_min: 2
        cp_max: 5

    app_service_config_files:
      - /secrets/whatsapp_registration
      - /secrets/meta_registration
      - /secrets/signal_registration
