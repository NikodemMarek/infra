apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
  namespace: matrix
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
      sectionName: internal
  hostnames:
    - "matrix.nkmrk.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /.well-known/matrix
      backendRefs:
        - name: synapse
          port: 8008
