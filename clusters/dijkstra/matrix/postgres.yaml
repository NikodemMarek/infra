apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-postgres
  namespace: matrix
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5efb66993894055f0aa50bd94337c6c4ff2e2129f4d433c527151aebbf283fb0
  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  storage:
    storageClass: openebs-hostpath
    size: 5Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: triss
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
  inheritedMetadata:
    annotations:
      pre.hook.backup.velero.io/container: postgres
      pre.hook.backup.velero.io/command: '["/bin/sh","-c","pg_dump -Fc -d synapse -f /var/lib/postgresql/data/synapse.dump.tmp && mv /var/lib/postgresql/data/synapse.dump.tmp /var/lib/postgresql/data/synapse.dump"]'
      pre.hook.backup.velero.io/on-error: Fail
      pre.hook.backup.velero.io/timeout: 10m
