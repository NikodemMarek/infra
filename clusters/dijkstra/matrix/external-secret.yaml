apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: matrix
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: secrets
    creationPolicy: Orphan
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        whatsapp_registration: |
          id: whatsapp
          url: http://whatsapp.matrix.svc.cluster.local:29318
          as_token: {{ .whatsapp_as_token }}
          hs_token: {{ .whatsapp_hs_token }}
          sender_localpart: k7Qm2xVbR9tLw4ZnHc8DyPa3SfJe6UgX
          rate_limited: false
          namespaces:
            users:
              - regex: '^@whatsappbot:nkmrk\.com$'
                exclusive: true
              - regex: '^@whatsapp_.*:nkmrk\.com$'
                exclusive: true
          de.sorunome.msc2409.push_ephemeral: true
          receive_ephemeral: true
        meta_registration: |
          id: meta
          url: http://meta.matrix.svc.cluster.local:29319
          as_token: {{ .meta_as_token }}
          hs_token: {{ .meta_hs_token }}
          sender_localpart: Bn5Wq8TzYh3KcR7vLd2MxPj9AsGf4UeN
          rate_limited: false
          namespaces:
            users:
              - regex: '^@metabot:nkmrk\.com$'
                exclusive: true
              - regex: '^@meta_.*:nkmrk\.com$'
                exclusive: true
          de.sorunome.msc2409.push_ephemeral: true
          receive_ephemeral: true
  data:
    - secretKey: agents_password
      remoteRef:
        key: matrix/agents_password
    - secretKey: gateway_signing_key
      remoteRef:
        key: matrix/gateway_signing_key
    - secretKey: meta_as_token
      remoteRef:
        key: matrix/meta_as_token
    - secretKey: meta_hs_token
      remoteRef:
        key: matrix/meta_hs_token
    - secretKey: registration_shared_secret
      remoteRef:
        key: matrix/registration_shared_secret
    - secretKey: whatsapp_as_token
      remoteRef:
        key: matrix/whatsapp_as_token
    - secretKey: whatsapp_hs_token
      remoteRef:
        key: matrix/whatsapp_hs_token
