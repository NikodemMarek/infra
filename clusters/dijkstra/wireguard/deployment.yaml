apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard
  labels:
    app: wireguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      nodeSelector:
        kubernetes.io/hostname: triss
      initContainers:
        - name: firewall
          image: docker.io/procustodibus/wireguard:v1.0.20260223
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          command:
            - sh
            - -ec
            - |
              ip link del wg-mullvad 2>/dev/null || true
              for p in 5000 5001 5002 5003; do ip rule del pref $p 2>/dev/null || true; done
              iptables -F FORWARD
              iptables -t nat -F POSTROUTING
              ip link add wg-mullvad type wireguard
              wg set wg-mullvad private-key /run/wireguard/mullvad_private_key peer HQHCrq4J6bSpdW1fI5hR/bvcrYa6HgGgwaa5ZY749ik= endpoint 185.213.155.73:51820 allowed-ips 0.0.0.0/0 persistent-keepalive 25
              ip address add "$(cat /run/wireguard/mullvad_address)" dev wg-mullvad
              ip link set wg-mullvad mtu 1200 up
              ip route add default dev wg-mullvad table 51821
              ip rule add to 10.42.0.0/15 lookup main pref 5000
              ip rule add to 100.97.10.25 lookup main pref 5001
              ip rule add to 10.13.13.0/24 lookup main pref 5002
              ip rule add from 10.13.13.0/24 lookup 51821 pref 5003
              iptables -A FORWARD -o wg0 -m conntrack ! --ctstate ESTABLISHED,RELATED -j DROP
              iptables -A FORWARD -i wg0 -o wg-mullvad -j ACCEPT
              iptables -A FORWARD -i wg0 -s 10.13.13.128/25 -o eth0 -d 10.42.0.0/15 -j ACCEPT
              iptables -A FORWARD -i wg0 -o eth0 -d 100.97.10.25 -p tcp -m multiport --dports 80,443 -j ACCEPT
              iptables -A FORWARD -i wg0 -o eth0 -d 10.43.0.53 -p udp --dport 53 -j ACCEPT
              iptables -A FORWARD -i wg0 -o eth0 -d 10.43.0.53 -p tcp --dport 53 -j ACCEPT
              iptables -A FORWARD -i wg0 -j REJECT
              iptables -t nat -A POSTROUTING -s 10.13.13.0/24 ! -o wg0 -j MASQUERADE
          volumeMounts:
            - name: key
              mountPath: /run/wireguard
              readOnly: true
      containers:
        - name: wireguard
          image: docker.io/procustodibus/wireguard:v1.0.20260223
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - name: wireguard
              containerPort: 51820
              hostPort: 51820
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/wireguard
            - name: key
              mountPath: /run/wireguard
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
      volumes:
        - name: config
          configMap:
            name: wireguard-config
            defaultMode: 0400
        - name: key
          secret:
            secretName: secrets
            items:
              - key: wireguard_private_key
                path: private_key
              - key: mullvad_private_key
                path: mullvad_private_key
              - key: mullvad_address
                path: mullvad_address
            defaultMode: 0400
