apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: wireguard
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: secrets
    creationPolicy: Orphan
  data:
    - secretKey: mullvad_address
      remoteRef:
        key: wireguard/mullvad_address
    - secretKey: mullvad_private_key
      remoteRef:
        key: wireguard/mullvad_private_key
    - secretKey: wireguard_private_key
      remoteRef:
        key: wireguard/wireguard_private_key
