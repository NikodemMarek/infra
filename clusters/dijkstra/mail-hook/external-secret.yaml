apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: mail-hook
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: secrets
    creationPolicy: Orphan
  data:
    - secretKey: mail_hook_token
      remoteRef:
        key: mail-hook/mail_hook_token
