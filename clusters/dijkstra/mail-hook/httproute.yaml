apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mail-hook
  namespace: mail-hook
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
      sectionName: websecure
  hostnames:
    - "mail-hook.nkmrk.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mail-hook
          port: 80
