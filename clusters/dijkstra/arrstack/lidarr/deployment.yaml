apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: arrstack
  labels:
    app: lidarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: regis
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: arrstack-config-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: arrstack-downloads-pvc
        - name: music
          persistentVolumeClaim:
            claimName: arrstack-music-pvc
        - name: youtube-cookies
          secret:
            secretName: secrets
            optional: true
            items:
              - key: youtube_cookies
                path: cookies.txt
      containers:
        - name: lidarr
          image: linuxserver/lidarr:nightly
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: webui
              containerPort: 8686
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: lidarr
            - name: downloads
              mountPath: /downloads
            - name: music
              mountPath: /music
            - name: youtube-cookies
              mountPath: /secrets/youtube
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
        # YouTube PO-token provider for Tubifarry (trustedSessionGeneratorUrl = http://localhost:4416).
        # Unauthenticated, so it stays pod-local with no Service.
        - name: bgutil-pot-provider
          image: brainicism/bgutil-ytdlp-pot-provider:latest
          ports:
            - name: pot
              containerPort: 4416
          resources:
            requests:
              cpu: "10m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
