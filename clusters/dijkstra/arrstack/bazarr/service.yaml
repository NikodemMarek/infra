# Backend service the KEDA interceptor forwards to.
apiVersion: v1
kind: Service
metadata:
  name: bazarr-app
  namespace: arrstack
spec:
  selector:
    app: bazarr
  ports:
    - name: webui
      protocol: TCP
      port: 80
      targetPort: 6767
---
# Keeps the in-cluster name working; traffic goes through the interceptor so it can wake the app.
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: arrstack
spec:
  type: ExternalName
  externalName: arrstack-interceptor.keda.svc.cluster.local
