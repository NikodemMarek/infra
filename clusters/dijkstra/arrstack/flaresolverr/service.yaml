# Backend service the KEDA interceptor forwards to.
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr-app
  namespace: arrstack
spec:
  selector:
    app: flaresolverr
  ports:
    - name: http
      protocol: TCP
      port: 8191
      targetPort: 8191
---
# Keeps the in-cluster name working; traffic goes through the interceptor so it can wake the app.
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: arrstack
spec:
  type: ExternalName
  externalName: arrstack-interceptor.keda.svc.cluster.local
