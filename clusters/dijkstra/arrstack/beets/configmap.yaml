apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-config
  namespace: arrstack
data:
  config.yaml: |
    directory: /music
    library: /music/library.db

    import:
      move: yes
      write: yes
      resume: no
      incremental: no
      quiet: yes
      quiet_fallback: asis
      duplicate_action: remove

    match:
      strong_rec_thresh: 0.10

    plugins:
      - musicbrainz
      - fetchart
      - embedart
      - lastgenre
      - lyrics
      - missing
      - duplicates
      - badfiles
      - edit

    embedart:
      remove_art_file: yes

    lyrics:
      synced: yes
      sources: [lrcmux, lrclib, genius]

  server.py: |
    #!/usr/bin/env python3
    import json
    import logging
    import os
    import queue
    import subprocess
    import sys
    import threading
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from urllib.parse import parse_qs, urlparse

    logging.basicConfig(
        level=logging.INFO,
        format='%(asctime)s [%(levelname)s] %(message)s',
        handlers=[logging.StreamHandler(sys.stdout)]
    )

    import_queue = queue.Queue()

    def run_beets_import(target_path):
        logging.info(f"Starting beets import for path: {target_path}")
        config_file = "/config/config.yaml"
        cmd = ["beet", "-c", config_file, "import", "-q", target_path]
        try:
            result = subprocess.run(
                cmd,
                stdout=subprocess.PIPE,
                stderr=subprocess.PIPE,
                text=True
            )
            if result.returncode == 0:
                logging.info(f"Successfully imported: {target_path}")
                if result.stdout.strip():
                    logging.info(f"Output: {result.stdout.strip()}")
            else:
                logging.error(f"Beets import failed for {target_path} (exit code {result.returncode})")
                if result.stderr.strip():
                    logging.error(f"Stderr: {result.stderr.strip()}")
                if result.stdout.strip():
                    logging.error(f"Stdout: {result.stdout.strip()}")
        except Exception as e:
            logging.exception(f"Exception during beets import for {target_path}: {e}")

    def worker():
        logging.info("Worker thread started and listening for import jobs.")
        while True:
            target_path = import_queue.get()
            try:
                run_beets_import(target_path)
            finally:
                import_queue.task_done()

    def extract_target_path(data, query_params):
        if 'path' in query_params and query_params['path']:
            p = query_params['path'][0]
            if os.path.exists(p):
                return p
            dl_p = os.path.join('/downloads', p.lstrip('/'))
            if os.path.exists(dl_p):
                return dl_p

        if not isinstance(data, dict):
            return None

        track_files = data.get("trackFiles")
        if isinstance(track_files, list):
            paths = [
                tf["path"] for tf in track_files
                if isinstance(tf, dict) and isinstance(tf.get("path"), str) and os.path.isabs(tf["path"])
            ]
            if paths:
                common = os.path.commonpath([os.path.dirname(p) for p in paths])
                if os.path.isdir(common) and not os.path.ismount(common):
                    return common

        candidates = [
            data.get("downloadPath"),
            data.get("download_path"),
            data.get("destinationFolderPath"),
            data.get("destination_folder_path"),
            data.get("folderPath"),
            data.get("folder_path"),
            data.get("artistPath"),
            data.get("artist_path"),
            data.get("path"),
            data.get("folder"),
            data.get("directory"),
        ]

        artist_obj = data.get("artist")
        if isinstance(artist_obj, dict) and artist_obj.get("path"):
            candidates.append(artist_obj.get("path"))

        added_tracks = data.get("addedTrackPaths") or data.get("added_track_paths")
        if isinstance(added_tracks, list) and len(added_tracks) > 0 and added_tracks[0]:
            candidates.append(os.path.dirname(added_tracks[0]))
        elif isinstance(added_tracks, str) and added_tracks:
            first_track = added_tracks.split('|')[0]
            candidates.append(os.path.dirname(first_track))

        for cand in candidates:
            if cand and isinstance(cand, str):
                cand = cand.strip()
                if os.path.exists(cand):
                    return cand
                dl_cand = os.path.join('/downloads', cand.lstrip('/'))
                if os.path.exists(dl_cand):
                    return dl_cand

        return None

    class WebhookHandler(BaseHTTPRequestHandler):
        def _send_json_response(self, code, response_data):
            body = json.dumps(response_data).encode('utf-8')
            self.send_response(code)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Content-Length', str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            parsed = urlparse(self.path)
            if parsed.path in ['/health', '/ping', '/']:
                self._send_json_response(200, {
                    "status": "ok",
                    "service": "beets-webhook-server",
                    "queue_size": import_queue.qsize()
                })
            else:
                self._send_json_response(404, {"error": "Not Found"})

        def do_POST(self):
            parsed = urlparse(self.path)
            query_params = parse_qs(parsed.query)

            content_length = int(self.headers.get('Content-Length', 0))
            post_data = {}
            if content_length > 0:
                raw_body = self.rfile.read(content_length)
                try:
                    post_data = json.loads(raw_body.decode('utf-8'))
                except Exception as e:
                    logging.warning(f"Failed to parse JSON body: {e}")

            logging.info(f"Received POST request to {self.path}. Payload: {post_data}")

            event_type = post_data.get("eventType") or post_data.get("event_type") or post_data.get("event")
            if event_type == "Test":
                logging.info("Handled Lidarr Test event successfully.")
                self._send_json_response(200, {
                    "status": "ok",
                    "message": "Lidarr webhook test successful"
                })
                return

            target_path = extract_target_path(post_data, query_params)

            if not target_path:
                if post_data.get("import_downloads") is True and os.path.exists("/downloads"):
                    target_path = "/downloads"

            if target_path:
                import_queue.put(target_path)
                logging.info(f"Queued import for path: {target_path} (Queue size: {import_queue.qsize()})")
                self._send_json_response(200, {
                    "status": "queued",
                    "message": "Import job queued successfully",
                    "path": target_path,
                    "queue_position": import_queue.qsize()
                })
            else:
                logging.warning(f"No valid target path found in payload or filesystem: {post_data}")
                self._send_json_response(400, {
                    "status": "error",
                    "message": "No valid target path found in request payload or filesystem."
                })

        def log_message(self, format, *args):
            logging.info(f"HTTP {self.command} {self.path} - {args[1] if len(args) > 1 else ''}")

    def main():
        port = int(os.environ.get("PORT", "8000"))

        t = threading.Thread(target=worker, daemon=True)
        t.start()

        server_address = ('', port)
        httpd = HTTPServer(server_address, WebhookHandler)
        logging.info(f"Beets Webhook Server running on port {port}...")
        try:
            httpd.serve_forever()
        except KeyboardInterrupt:
            pass
        httpd.server_close()
        logging.info("Server stopped.")

    if __name__ == '__main__':
        main()

  backup.py: |
    #!/usr/bin/env python3
    # Copies the beets library to <dest_dir>/library-<date>.db (a consistent
    # snapshot, checked with integrity_check) and keeps the newest <keep> copies.
    import datetime
    import fnmatch
    import os
    import sqlite3

    def backup(src, dest_dir, keep=7, today=None):
        today = today or datetime.date.today()
        final = os.path.join(dest_dir, f"library-{today.isoformat()}.db")
        tmp = os.path.join(dest_dir, "library.db.tmp")
        source = sqlite3.connect(f"file:{src}?mode=ro", uri=True, timeout=60)
        try:
            copy = sqlite3.connect(tmp)
            try:
                source.backup(copy)
                rows = copy.execute("PRAGMA integrity_check").fetchall()
            finally:
                copy.close()
        except BaseException:
            if os.path.exists(tmp):
                os.remove(tmp)
            raise
        finally:
            source.close()
        if rows != [("ok",)]:
            os.remove(tmp)
            raise SystemExit(f"integrity_check failed for the copy of {src}: {rows}")
        os.replace(tmp, final)
        copies = sorted(n for n in os.listdir(dest_dir) if fnmatch.fnmatch(n, "library-*.db"))
        for name in copies[:max(len(copies) - keep, 0)]:
            os.remove(os.path.join(dest_dir, name))
        return final

    if __name__ == '__main__':
        print(backup("/music/library.db", "/backup"))
