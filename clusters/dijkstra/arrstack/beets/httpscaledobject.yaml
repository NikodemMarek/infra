apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: beets
  namespace: arrstack
spec:
  hosts:
    - beets
    - beets.arrstack
    - beets.arrstack.svc
    - beets.arrstack.svc.cluster.local
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beets
    service: beets-app
    port: 80
  replicas:
    min: 1
    max: 1
  # Always one replica, so imports are never cut off by a scale-down.
  scaledownPeriod: 1800
  scalingMetric:
    concurrency:
      targetValue: 1
