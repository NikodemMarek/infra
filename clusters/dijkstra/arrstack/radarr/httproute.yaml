apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: arrstack
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
      sectionName: internal
  hostnames:
    - "radarr.nkmrk.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radarr
          port: 80
