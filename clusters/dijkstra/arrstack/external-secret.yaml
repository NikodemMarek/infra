apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: arrstack
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: secrets
    creationPolicy: Orphan
  data:
    - secretKey: mullvad_address
      remoteRef:
        key: arrstack/mullvad_address
    - secretKey: mullvad_private_key
      remoteRef:
        key: arrstack/mullvad_private_key
    - secretKey: youtube_cookies
      remoteRef:
        key: arrstack/youtube_cookies
