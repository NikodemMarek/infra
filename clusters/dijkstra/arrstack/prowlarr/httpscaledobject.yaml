apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: prowlarr
  namespace: arrstack
spec:
  hosts:
    - prowlarr
    - prowlarr.arrstack
    - prowlarr.arrstack.svc
    - prowlarr.arrstack.svc.cluster.local
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prowlarr
    service: prowlarr-app
    port: 80
  replicas:
    min: 0
    max: 1
  # Scale to zero after 30 minutes without requests.
  scaledownPeriod: 1800
  scalingMetric:
    concurrency:
      targetValue: 1
