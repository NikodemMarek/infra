---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrstack-downloads-pvc
  namespace: arrstack
  labels:
    backup: skip
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: openebs-zfs
  resources:
    requests:
      storage: 100Gi
  volumeName: arrstack-downloads-pv
