apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrstack-shows-pvc
  namespace: arrstack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 200Gi
  volumeName: arrstack-shows-pv
---
