apiVersion: apps/v1
kind: Deployment
metadata:
  name: webdav
  namespace: omniverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webdav
  template:
    metadata:
      labels:
        app: webdav
    spec:
      nodeSelector:
        kubernetes.io/hostname: triss
      volumes:
        - name: omniverse-volume
          persistentVolumeClaim:
            claimName: omniverse-pvc
      containers:
        - name: webdav
          image: rclone/rclone:latest
          args:
            - serve
            - webdav
            - /omniverse
            - --copy-links
            - --exclude
            - .git/
            - --exclude
            - /dav/
            - --addr
            - :80
            - --user
            - $(DAV_USER)
            - --pass
            - $(DAV_PASS)
          env:
            - name: DAV_USER
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: webdav_user
            - name: DAV_PASS
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: webdav_password
          volumeMounts:
            - name: omniverse-volume
              mountPath: /omniverse
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "300m"
