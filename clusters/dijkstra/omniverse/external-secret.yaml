apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: omniverse
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: secrets
    creationPolicy: Orphan
  data:
    - secretKey: calendar_subscriptions
      remoteRef:
        key: omniverse/calendar_subscriptions
    - secretKey: git_token
      remoteRef:
        key: omniverse/git_token
    - secretKey: git_username
      remoteRef:
        key: omniverse/git_username
    - secretKey: radicale_password
      remoteRef:
        key: omniverse/radicale_password
    - secretKey: radicale_subscriber_password
      remoteRef:
        key: omniverse/radicale_subscriber_password
    - secretKey: webdav_password
      remoteRef:
        key: omniverse/webdav_password
    - secretKey: webdav_user
      remoteRef:
        key: omniverse/webdav_user
