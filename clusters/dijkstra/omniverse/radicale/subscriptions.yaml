apiVersion: v1
kind: ConfigMap
metadata:
  name: calendar-subscriptions
  namespace: omniverse
data:
  refresh.sh: |
    #!/bin/sh
    # Replaces the Radicale collection nikodem/sub-<name> with the iCal feed at <url>
    # for every line "<name> <url>" of /omniverse/calendar-subscriptions.md
    # (<name> matches [a-z0-9][a-z0-9-]*, <url> is http(s) or webcal); all other
    # lines are ignored.
    # Feed URLs may contain secret tokens: never print them.
    # A failed fetch leaves the previous collection untouched.
    # To remove a feed, delete its line, then run:
    # kubectl -n omniverse exec deploy/radicale -- rm -r /data/collection-root/nikodem/sub-<name>
    set -u
    list=/omniverse/calendar-subscriptions.md
    feeds=/tmp/feeds
    [ -f "$list" ] || { echo "no $list, nothing to do"; exit 0; }
    [ -r "$list" ] || { echo "cannot read $list" >&2; exit 1; }
    # no pipe into the loop: it would run in a subshell and lose $status
    grep -E '^[a-z0-9][a-z0-9-]* (https?|webcal)://[^[:space:]]+[[:space:]]*$' "$list" | tr -d '\r' > "$feeds"
    status=0
    while read -r name url; do
      case "$url" in webcal://*) url="https://${url#webcal://}" ;; esac
      if curl -fsSL --max-time 60 -o /tmp/feed.ics "$url" \
        && grep -q '^BEGIN:VCALENDAR' /tmp/feed.ics \
        && curl -fsS --max-time 120 -o /dev/null -u "subscriber:$RADICALE_SUBSCRIBER_PASSWORD" \
          -X PUT -H 'Content-Type: text/calendar; charset=utf-8' --data-binary @/tmp/feed.ics \
          "${RADICALE_URL:-http://radicale}/nikodem/sub-$name/"; then
        echo "updated $name"
      else
        echo "failed $name" >&2
        status=1
      fi
    done < "$feeds"
    exit $status
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calendar-subscriptions
  namespace: omniverse
spec:
  schedule: "0 4 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: triss
          restartPolicy: Never
          volumes:
            - name: omniverse-volume
              persistentVolumeClaim:
                claimName: omniverse-pvc
                readOnly: true
            - name: scripts
              configMap:
                name: calendar-subscriptions
                defaultMode: 0755
          containers:
            - name: refresh
              image: curlimages/curl:8.16.0
              command: ["/scripts/refresh.sh"]
              env:
                - name: RADICALE_SUBSCRIBER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: secrets
                      key: radicale_subscriber_password
              volumeMounts:
                - name: omniverse-volume
                  mountPath: /omniverse
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 128Mi
                  cpu: 300m
