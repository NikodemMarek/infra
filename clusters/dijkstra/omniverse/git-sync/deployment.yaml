apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-sync
  namespace: omniverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-sync
  template:
    metadata:
      labels:
        app: git-sync
    spec:
      nodeSelector:
        kubernetes.io/hostname: triss
      volumes:
        - name: omniverse-volume
          persistentVolumeClaim:
            claimName: omniverse-pvc
        - name: gitignore
          configMap:
            name: omniverse-gitignore
      containers:
        - name: git-sync
          image: alpine/git:latest
          volumeMounts:
            - name: omniverse-volume
              mountPath: /omniverse
            - name: gitignore
              mountPath: /etc/omniverse
              readOnly: true
          env:
            - name: GIT_USER
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: git_username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: git_token
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          command: ["/bin/sh", "-c"]
          args:
            - |
              cd /omniverse

              git config --global --add safe.directory /omniverse
              git config --global advice.addEmptyPathspec false
              git config --global user.email "git-sync@omniverse.local"
              git config --global user.name "Git Sync"
              git config --global core.excludesFile /etc/omniverse/gitignore

              if [ ! -d ".git" ]; then
                echo "Cloning the repository..."
                git clone https://${GIT_USER}:${GIT_TOKEN}@github.com/${GIT_USER}/omniverse.git .
              fi

              # Files >= 90 MiB are skipped; find -size rounds up to whole units, so compare in bytes.
              export SIZE_LIMIT="94371840c"

              while true; do
                # Ignore rules live in the omniverse-gitignore ConfigMap.
                # Only untracked, non-ignored paths are passed to git add (it errors on ignored ones).
                git ls-files -z --others --exclude-standard \
                  | xargs -0 -r sh -c 'find "$@" -maxdepth 0 -type f -size -"$SIZE_LIMIT" -print0' sh \
                  | xargs -0 -r git add --

                git add -u

                if ! git diff --cached --quiet; then
                  echo "Eligible changes detected. Committing and pushing..."
                  git commit -m "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  git push https://${GIT_USER}:${GIT_TOKEN}@github.com/${GIT_USER}/omniverse.git main
                else
                  echo "No eligible changes under ${SIZE_LIMIT} to push."
                fi

                sleep 60
              done
