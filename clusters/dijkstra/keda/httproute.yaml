apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: keda
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
      sectionName: internal
  hostnames:
    - "bazarr.nkmrk.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: arrstack-interceptor
          port: 80
---
