apiVersion: v1
kind: Service
metadata:
  name: arrstack-interceptor
  namespace: keda
spec:
  selector:
    app.kubernetes.io/component: interceptor
    app.kubernetes.io/name: http-add-on
    app.kubernetes.io/instance: keda-add-ons-http
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: proxy
    - name: flaresolverr
      protocol: TCP
      port: 8191
      targetPort: proxy
