apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: secrets
    creationPolicy: Orphan
  data:
    - secretKey: grafana_admin_password
      remoteRef:
        key: monitoring/grafana_admin_password
