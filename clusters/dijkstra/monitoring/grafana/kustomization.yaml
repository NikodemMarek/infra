apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [helm.yaml, httproute.yaml]
generatorOptions:
  labels:
    grafana_dashboard: "1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: dashboard-node-exporter-full
    namespace: monitoring
    files: [dashboards/node-exporter-full.json]
  - name: dashboard-k8s-views-global
    namespace: monitoring
    files: [dashboards/k8s-views-global.json]
  - name: dashboard-k8s-views-nodes
    namespace: monitoring
    files: [dashboards/k8s-views-nodes.json]
  - name: dashboard-k8s-views-pods
    namespace: monitoring
    files: [dashboards/k8s-views-pods.json]
  - name: dashboard-traefik
    namespace: monitoring
    files: [dashboards/traefik.json]
  - name: dashboard-cloudnative-pg
    namespace: monitoring
    files: [dashboards/cloudnative-pg.json]
  - name: dashboard-victoria-metrics-single
    namespace: monitoring
    files: [dashboards/victoria-metrics-single.json]
