apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: cert-manager
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: secrets
    creationPolicy: Orphan
  data:
    - secretKey: cloudflare_api_token
      remoteRef:
        key: cert-manager/cloudflare_api_token
