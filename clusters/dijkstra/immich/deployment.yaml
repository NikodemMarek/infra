apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: immich
  labels:
    app: immich
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      nodeSelector:
        kubernetes.io/hostname: regis
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: immich-photos-pvc
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v3.4.2
          ports:
            - containerPort: 2283
          env:
            - name: IMMICH_PORT
              value: "2283"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-app
                  key: uri
            - name: REDIS_HOSTNAME
              value: immich-redis
          volumeMounts:
            - name: photos
              mountPath: /data
          resources:
            requests:
              memory: "768Mi"
              cpu: "50m"
            limits:
              # 768Mi got OOMKilled while ingesting a bulk upload (thumbnails + metadata in the same process)
              memory: "2Gi"
              cpu: "1000m"
              gpu.intel.com/i915: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
  labels:
    app: immich-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: regis
      containers:
        - name: immich-redis
          image: docker.io/valkey/valkey:9@sha256:169567d6288e5f08aa141847c0c3e0864a32e727682ca6f052a20567c7103ef8
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "300m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app: immich-machine-learning
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      nodeSelector:
        kubernetes.io/hostname: regis
      volumes:
        - name: ml
          persistentVolumeClaim:
            claimName: immich-ml-pvc
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.1-openvino
          ports:
            - containerPort: 3003
          env:
            - name: IMMICH_PORT
              value: "3003"
            # the default "main" models force FP32, which needs over 3Gi to load the CLIP and face models on the iGPU
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: v2
            # default is one thread per CPU: CLIP and both face models then load at once and blow the 4Gi limit
            - name: MACHINE_LEARNING_REQUEST_THREADS
              value: "1"
            - name: MACHINE_LEARNING_MODEL_TTL
              value: "60"
          volumeMounts:
            - name: ml
              mountPath: /cache
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              # OpenVINO keeps compiled models in iGPU memory, which is system RAM charged to this cgroup
              memory: "4Gi"
              cpu: "2000m"
              gpu.intel.com/i915: "1"
