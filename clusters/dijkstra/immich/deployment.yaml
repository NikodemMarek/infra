apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: immich
  labels:
    app: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      nodeSelector:
        kubernetes.io/hostname: regis
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: immich-photos-pvc
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v2.4.1
          ports:
            - containerPort: 2283
            - name: metrics-api
              containerPort: 8081
            - name: metrics-micro
              containerPort: 8082
          env:
            - name: IMMICH_PORT
              value: "2283"
            - name: IMMICH_TELEMETRY_INCLUDE
              value: all
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-app
                  key: uri
            - name: REDIS_HOSTNAME
              value: immich-redis
          volumeMounts:
            - name: photos
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              # 768Mi got OOMKilled while ingesting a bulk upload (thumbnails + metadata in the same process)
              memory: "1536Mi"
              cpu: "1000m"
              gpu.intel.com/i915: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
  labels:
    app: immich-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: regis
      containers:
        - name: immich-redis
          image: docker.io/valkey/valkey:9@sha256:fb8d272e529ea567b9bf1302245796f21a2672b8368ca3fcb938ac334e613c8f
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "300m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app: immich-machine-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      nodeSelector:
        kubernetes.io/hostname: regis
      volumes:
        - name: ml
          persistentVolumeClaim:
            claimName: immich-ml-pvc
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v2.4.1-openvino
          ports:
            - containerPort: 3003
          env:
            - name: IMMICH_PORT
              value: "3003"
            # FP32 (the default) needs over 3Gi to load the CLIP and face models on the iGPU
            - name: MACHINE_LEARNING_OPENVINO_PRECISION
              value: FP16
          volumeMounts:
            - name: ml
              mountPath: /cache
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              # OpenVINO keeps compiled models in iGPU memory, which is system RAM charged to this cgroup
              memory: "4Gi"
              cpu: "2000m"
              gpu.intel.com/i915: "1"
