apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitwarden-sdk-server
  namespace: external-secrets
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/external-secrets/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-sdk-server
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: bitwarden-sdk-server
      version: "v0.8.1"
      sourceRef:
        kind: HelmRepository
        name: bitwarden-sdk-server
        namespace: external-secrets
  values:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
