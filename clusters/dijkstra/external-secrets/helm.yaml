apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "2.15.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  values:
    crds:
      annotations:
        helm.sh/resource-policy: keep
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    webhook:
      failurePolicy: Ignore
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
