apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: default
spec:
  interval: 1m
  url: https://helm.traefik.io/traefik
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: default
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
      version: 38.0.1
  interval: 1m
  values:
    resources:
      requests:
        memory: "64Mi"
        cpu: "20m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    ports:
      web:
        port: 80
        nodePort: 30000
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      internal:
        port: 9443
        expose:
          default: false
    service:
      spec:
        loadBalancerSourceRanges:
          - 100.64.0.0/10
          - 10.42.0.0/15
    ingressClass:
      enabled: false
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    metrics:
      prometheus: null
    logs:
      general:
        level: INFO
      access:
        enabled: true
    additionalArguments:
      - "--entrypoints.websecure.http.encodedcharacters.allowencodedslash=true"
      - "--entrypoints.websecure.http.encodedcharacters.allowencodedquestionmark=true"
      - "--entrypoints.internal.http.encodedcharacters.allowencodedslash=true"
      - "--entrypoints.internal.http.encodedcharacters.allowencodedquestionmark=true"
