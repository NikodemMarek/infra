apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: internal
      port: 9443
      protocol: HTTPS
      hostname: "*.nkmrk.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: nkmrk-com-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure
      port: 8443
      protocol: HTTPS
      hostname: "*.nkmrk.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: nkmrk-com-tls
      allowedRoutes:
        namespaces:
          from: All
