apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 1h
  url: https://openebs.github.io/openebs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: v4.5.1
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: openebs
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    engines:
      replicated:
        mayastor:
          enabled: false
    localpv-provisioner:
      hostpathClass:
        reclaimPolicy: Retain
    zfs-localpv:
      zfs:
        # the node plugin runs the host's zfs via chroot; NixOS has no /sbin/zfs
        bin: /run/current-system/sw/bin/zfs
