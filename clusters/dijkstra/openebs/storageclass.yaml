apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfs
provisioner: zfs.csi.openebs.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  fstype: "zfs"
  poolname: "rpool/openebs"
  # arrstack-config is mounted by several pods on regis; zfs-localpv refuses a second mount otherwise
  shared: "yes"
