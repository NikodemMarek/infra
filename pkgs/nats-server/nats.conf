# clients on this host only; no JetStream, so no state
host: "127.0.0.1"
port: 4222
reconnect_error_reports: 3600

# only remote.notify.> (and other non-denied subjects) crosses the leaf link;
# local events, system queries, the JetStream API and request replies stay local
leafnodes {
  remotes: [
    {
      urls: ["nats-leaf://nats.nats.svc.cluster.local:7422"]
      deny_imports: ["events.>", "$SYS.>", "$JS.>", "$KV.>", "$O.>", "_INBOX.>"]
      deny_exports: ["events.>", "$SYS.>", "$JS.>", "$KV.>", "$O.>", "_INBOX.>"]
    }
  ]
}
