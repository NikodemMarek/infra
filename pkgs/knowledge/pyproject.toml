[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge"
version = "0.1.0"
description = "Knowledge curator: collects what agents learn and keeps a curated store in the memory repo"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
knowledge = "knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
extra_checks = true

# the only place untyped data (json, toml) enters; everything leaving it is Json
[[tool.mypy.overrides]]
module = "knowledge.data"
disallow_any_expr = false
