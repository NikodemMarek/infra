[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "event-router"
version = "0.1.0"
description = "Receive events over HTTP and dispatch them to handlers"
requires-python = ">=3.12"

[project.scripts]
event-router = "event_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
extra_checks = true

# the only place untyped data (json) enters; everything leaving it is Json
[[tool.mypy.overrides]]
module = "event_router.data"
disallow_any_expr = false
