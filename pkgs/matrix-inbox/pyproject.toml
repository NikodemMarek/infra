[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-inbox"
version = "0.1.0"
description = "Posts answerable agent-inbox items to Matrix over NATS and runs the gateway's signed replies and commands"
requires-python = ">=3.12"
dependencies = ["cryptography"]

[project.scripts]
matrix-inbox-post = "matrix_inbox.cli:post"
matrix-inbox-answer = "matrix_inbox.cli:answer"
matrix-inbox-command = "matrix_inbox.cli:command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
extra_checks = true

# the only place untyped data (json) enters; everything leaving it is Json
[[tool.mypy.overrides]]
module = "matrix_inbox.data"
disallow_any_expr = false
