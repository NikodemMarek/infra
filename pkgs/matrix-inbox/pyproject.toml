[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-inbox"
version = "0.1.0"
description = "Mirrors answerable agent-inbox items into a Matrix room and answers them from the owner's replies"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
matrix-inbox = "matrix_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
extra_checks = true

# the only place untyped data (json) enters; everything leaving it is Json
[[tool.mypy.overrides]]
module = "matrix_inbox.data"
disallow_any_expr = false
