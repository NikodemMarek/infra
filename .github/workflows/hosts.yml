name: hosts

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: geralt, runner: ubuntu-latest}
          - {host: yenn, runner: ubuntu-latest}
          - {host: roach, runner: ubuntu-latest}
          - {host: regis, runner: ubuntu-latest}
          - {host: triss, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.event_name == 'push' && 'nix-cache' || '' }}
    env:
      HOST: ${{ matrix.host }}
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            extra-trusted-public-keys = nix-cache-1:WFfV/XlLBXZdMcKtaAEB4MSIQlXf6FYa6rqGxxmUcw0=
            connect-timeout = 5
            fallback = true
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        continue-on-error: ${{ github.event_name != 'push' }}
        with:
          oauth-client-id: ${{ secrets.TS_CACHE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CACHE_OAUTH_SECRET }}
          tags: tag:ci-cache
      - name: nix cache
        run: |
          echo "100.100.215.91 nix-cache" | sudo tee -a /etc/hosts >/dev/null
          if curl -sf --max-time 5 --retry 5 --retry-all-errors --retry-delay 5 http://nix-cache:3902/nix-cache-info >/dev/null; then
            echo "NIX_CONFIG=extra-substituters = http://nix-cache:3902?priority=50" >> "$GITHUB_ENV"
          fi
      - name: placeholder secrets
        run: |
          mkdir "$RUNNER_TEMP/secrets"
          nix eval --json ".#nixosConfigurations.$HOST.config.secrets" --apply 'builtins.mapAttrs (_: _: "dummy")' \
            | nix shell --inputs-from . nixpkgs#sops -c sops encrypt --input-type json --output-type yaml \
              --filename-override "host/$HOST/secrets.yaml" /dev/stdin > "$RUNNER_TEMP/secrets/$HOST.yaml"
      - run: nix build --out-link "$RUNNER_TEMP/toplevel" ".#nixosConfigurations.$HOST.config.system.build.toplevel" --override-input secrets "path:$RUNNER_TEMP/secrets"
      - name: upload
        if: github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$RUNNER_TEMP/nix-cache-key"
          nix copy --to "s3://nix-cache?endpoint=http://nix-cache:3900&region=garage&compression=zstd&secret-key=$RUNNER_TEMP/nix-cache-key" "$RUNNER_TEMP/toplevel"
