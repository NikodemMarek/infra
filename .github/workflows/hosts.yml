name: hosts

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: geralt, runner: ubuntu-latest}
          - {host: yenn, runner: ubuntu-latest}
          - {host: roach, runner: ubuntu-latest}
          - {host: regis, runner: ubuntu-latest}
          - {host: triss, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      HOST: ${{ matrix.host }}
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: placeholder secrets
        run: |
          mkdir "$RUNNER_TEMP/secrets"
          nix eval --json ".#nixosConfigurations.$HOST.config.secrets" --apply 'builtins.mapAttrs (_: _: "dummy")' \
            | nix shell --inputs-from . nixpkgs#sops -c sops encrypt --input-type json --output-type yaml \
              --filename-override "host/$HOST/secrets.yaml" /dev/stdin > "$RUNNER_TEMP/secrets/$HOST.yaml"
      - run: nix build --no-link ".#nixosConfigurations.$HOST.config.system.build.toplevel" --override-input secrets "path:$RUNNER_TEMP/secrets"
