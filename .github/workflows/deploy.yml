name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

defaults:
  run:
    shell: bash

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: geralt, runner: ubuntu-latest}
          - {host: regis, runner: ubuntu-latest}
          - {host: triss, runner: ubuntu-24.04-arm}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    environment: deploy
    env:
      HOST: ${{ matrix.host }}
    steps:
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache >/dev/null 2>&1 || { echo "::error::freeing disk space failed"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: secrets
        id: secrets
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          umask 077
          hosts=$(nix run .#bws-project -- hosts 2>/dev/null) || { echo "::error::fetching secrets failed"; exit 1; }
          jq -r '
            .[] | strings | splits("[\r\n]") | select(. != "")
            | "::add-mask::\(gsub("%"; "%25"))"
          ' <<< "$hosts" 2>/dev/null || { echo "::error::masking secrets failed"; exit 1; }
          mkdir -p ~/.ssh >/dev/null 2>&1 || { echo "::error::creating ~/.ssh failed"; exit 1; }
          jq -er '.["ci/ssh_id_ed25519"] // error("ci/ssh_id_ed25519 missing")' <<< "$hosts" > ~/.ssh/id_ed25519 2>/dev/null || { echo "::error::reading the ssh key failed"; exit 1; }
          ts_oauth_client_id=$(jq -er '.["ci/tailscale_oauth_client_id"] // error("ci/tailscale_oauth_client_id missing")' <<< "$hosts" 2>/dev/null) || { echo "::error::reading the Tailscale OAuth client id failed"; exit 1; }
          ts_oauth_secret=$(jq -er '.["ci/tailscale_oauth_client_secret"] // error("ci/tailscale_oauth_client_secret missing")' <<< "$hosts" 2>/dev/null) || { echo "::error::reading the Tailscale OAuth client secret failed"; exit 1; }
          echo "ts_oauth_client_id=$ts_oauth_client_id" >> "$GITHUB_OUTPUT"
          echo "ts_oauth_secret=$ts_oauth_secret" >> "$GITHUB_OUTPUT"
          nix run .#secrets-build -- "$RUNNER_TEMP/secrets" "$HOST" >/dev/null 2>&1 || { echo "::error::building host secrets failed"; exit 1; }
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ steps.secrets.outputs.ts_oauth_client_id }}
          oauth-secret: ${{ steps.secrets.outputs.ts_oauth_secret }}
          tags: tag:ci
      - name: reachability
        id: reachable
        run: |
          if tailscale ping -c 1 --timeout 10s "$HOST" >/dev/null 2>&1; then
            echo "online=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HOST is offline, not deployed"
          fi
      - name: deploy
        if: steps.reachable.outputs.online == 'true'
        run: |
          nix eval --raw .#knownHosts > "$RUNNER_TEMP/known_hosts" 2>/dev/null || { echo "::error::reading the known hosts failed"; exit 1; }
          nix run --inputs-from . deploy-rs -- --skip-checks \
            --ssh-opts "-o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes" \
            --targets ".#$HOST" -- --override-input secrets "path:$RUNNER_TEMP/secrets" >/dev/null 2>&1 || { echo "::error::deploying $HOST failed"; exit 1; }
