name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

defaults:
  run:
    shell: bash

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: geralt, runner: ubuntu-latest}
          - {host: regis, runner: ubuntu-latest}
          - {host: triss, runner: ubuntu-24.04-arm}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    environment: deploy
    env:
      HOST: ${{ matrix.host }}
    steps:
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache >/dev/null 2>&1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            extra-trusted-public-keys = nix-cache-1:WFfV/XlLBXZdMcKtaAEB4MSIQlXf6FYa6rqGxxmUcw0=
            connect-timeout = 5
            fallback = true
      - name: secrets
        id: secrets
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          exec 2>/dev/null
          umask 077
          hosts=$(nix run .#bws-project -- hosts)
          jq -r '.[] | strings | splits("[\r\n]") | select(. != "") | "::add-mask::\(gsub("%"; "%25"))"' <<< "$hosts"
          ci() { jq -er --arg k "ci/$1" '.[$k]' <<< "$hosts"; }

          mkdir -p ~/.ssh
          ci ssh_id_ed25519 > ~/.ssh/id_ed25519
          id=$(ci tailscale_oauth_client_id)
          secret=$(ci tailscale_oauth_client_secret)
          echo "ts_oauth_client_id=$id" >> "$GITHUB_OUTPUT"
          echo "ts_oauth_secret=$secret" >> "$GITHUB_OUTPUT"

          nix run .#secrets-build -- "$RUNNER_TEMP/secrets" "$HOST" >/dev/null
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ steps.secrets.outputs.ts_oauth_client_id }}
          oauth-secret: ${{ steps.secrets.outputs.ts_oauth_secret }}
          tags: tag:ci
      - name: nix cache
        run: |
          echo "100.100.215.91 nix-cache" | sudo tee -a /etc/hosts >/dev/null
          if curl -sf --max-time 5 --retry 5 --retry-all-errors --retry-delay 5 http://nix-cache:3902/nix-cache-info >/dev/null; then
            echo "NIX_CONFIG=extra-substituters = http://nix-cache:3902?priority=50" >> "$GITHUB_ENV"
          fi
      - name: reachability
        id: reachable
        run: |
          for _ in $(seq 12); do
            if tailscale ping -c 1 --timeout 5s "$HOST" >/dev/null 2>&1; then
              echo "online=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::$HOST is offline, not deployed"
      - name: deploy
        if: steps.reachable.outputs.online == 'true'
        run: |
          log=$RUNNER_TEMP/deploy.log
          exec 3>&1 >"$log" 2>&1
          trap '[ $? -eq 0 ] || tail -n 100 "$log" >&3' EXIT
          nix eval --raw .#knownHosts > "$RUNNER_TEMP/known_hosts"
          ssh_opts="-o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          override=(--override-input secrets "path:$RUNNER_TEMP/secrets")
          nix run --inputs-from . deploy-rs -- --skip-checks --ssh-opts "$ssh_opts" \
            --targets ".#$HOST" -- "${override[@]}"
          # deploy-rs exits 0 after a magic rollback when the late confirm still succeeds
          want=$(nix eval --raw ".#deploy.nodes.$HOST.profiles.system.path" "${override[@]}")
          # shellcheck disable=SC2086
          got=$(ssh $ssh_opts "maintenance@$HOST" readlink -f /nix/var/nix/profiles/system) || true
          if [ "$got" != "$want" ]; then
            echo "::error::$HOST runs ${got:-unknown}, not $want (rolled back?)" >&3
            exit 1
          fi
