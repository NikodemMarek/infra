# The inventory of every secret a host has, and the single list of secret names.
# One profile per host, plus `dijkstra` for the cluster-level secrets (hosts
# reference it with `secrets.<name>.profile`). Keys are the uppercased
# `secrets.<name>` names the host's modules use (checked in
# modules/host/secrets.nix). Keys that only feed a `composed` secret are inputs
# and are not written to the sops file.
# `secrets-build` (see devenv.nix) turns a profile into an encrypted sops file.
# Profiles `dijkstra-<ns>` are the Kubernetes Secret `secrets` of namespace <ns>
# (keys lowercased, `[a-z0-9_]` only); `cluster-secrets-build` turns them into
# clusters/dijkstra/secrets/<ns>.enc.yaml. A host may read one of their keys
# with `secrets.<name>.profile`.

[project]
name = "dotfiles"
revision = "1.0"
require_reason = false

[providers]
bw = "bw://?folder=infra/{profile}"

[defaults]
providers = ["bw"]

[profiles.dijkstra]
FLUX_SOPS_AGE_KEY = { description = "age private key of cluster dijkstra (&dijkstra_cluster in .sops.yaml), applied as flux-system/sops-age by the k3s server (services.flux-sops-age)", required = true }

[profiles."dijkstra-arrstack"]
YOUTUBE_COOKIES = { description = "Netscape-format cookies.txt of a (throwaway) YouTube account, used by Lidarr Tubifarry", required = true }
MULLVAD_PRIVATE_KEY = { description = "Mullvad WireGuard private key of qbittorrent (wg genkey, registered as a device on the Mullvad account)", required = true }
MULLVAD_ADDRESS = { description = "IPv4 address Mullvad assigned to that key, e.g. 10.64.1.2/32", required = true }

[profiles."dijkstra-cert-manager"]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token (Zone:DNS:Edit + Zone:Read, nkmrk.com only) for cert-manager DNS-01", required = true }

[profiles."dijkstra-cloudflare"]
CREDENTIALS_JSON = { description = "cloudflared tunnel credentials file (credentials.json)", required = true }

[profiles."dijkstra-matrix"]
REGISTRATION_SHARED_SECRET = { description = "Synapse registration shared secret, random (openssl rand -hex 32), used by register_new_matrix_user", required = true }
WHATSAPP_AS_TOKEN = { description = "mautrix-whatsapp appservice token (bridge to Synapse), random (openssl rand -hex 32), env BRIDGE_APPSERVICE__AS_TOKEN; input of WHATSAPP_REGISTRATION", required = true }
WHATSAPP_HS_TOKEN = { description = "mautrix-whatsapp homeserver token (Synapse to bridge), random (openssl rand -hex 32), env BRIDGE_APPSERVICE__HS_TOKEN; input of WHATSAPP_REGISTRATION", required = true }
WHATSAPP_REGISTRATION = { description = "appservice registration file of the WhatsApp bridge, read by Synapse (what `mautrix-whatsapp -g` generates)", composed = "id: whatsapp\nurl: http://whatsapp.matrix.svc.cluster.local:29318\nas_token: ${WHATSAPP_AS_TOKEN}\nhs_token: ${WHATSAPP_HS_TOKEN}\nsender_localpart: k7Qm2xVbR9tLw4ZnHc8DyPa3SfJe6UgX\nrate_limited: false\nnamespaces:\n  users:\n    - regex: '^@whatsappbot:nkmrk\\.com$'\n      exclusive: true\n    - regex: '^@whatsapp_.*:nkmrk\\.com$'\n      exclusive: true\nde.sorunome.msc2409.push_ephemeral: true\nreceive_ephemeral: true\n" }
META_AS_TOKEN = { description = "mautrix-meta appservice token (bridge to Synapse), random (openssl rand -hex 32), env BRIDGE_APPSERVICE__AS_TOKEN; input of META_REGISTRATION", required = true }
META_HS_TOKEN = { description = "mautrix-meta homeserver token (Synapse to bridge), random (openssl rand -hex 32), env BRIDGE_APPSERVICE__HS_TOKEN; input of META_REGISTRATION", required = true }
META_REGISTRATION = { description = "appservice registration file of the Messenger bridge, read by Synapse (what `mautrix-meta -g` generates)", composed = "id: meta\nurl: http://meta.matrix.svc.cluster.local:29319\nas_token: ${META_AS_TOKEN}\nhs_token: ${META_HS_TOKEN}\nsender_localpart: Bn5Wq8TzYh3KcR7vLd2MxPj9AsGf4UeN\nrate_limited: false\nnamespaces:\n  users:\n    - regex: '^@metabot:nkmrk\\.com$'\n      exclusive: true\n    - regex: '^@meta_.*:nkmrk\\.com$'\n      exclusive: true\nde.sorunome.msc2409.push_ephemeral: true\nreceive_ephemeral: true\n" }
AGENTS_PASSWORD = { description = "password of the Matrix bot @agents:nkmrk.com (not an admin); matrix-gateway logs in with it", required = true }
GATEWAY_SIGNING_KEY = { description = "Ed25519 private key of matrix-gateway, base64 (`nix run .#matrix-gateway -- keygen`); the public key is MATRIX_GATEWAY_KEY in host/yenn/matrix-inbox.nix", required = true }

[profiles."dijkstra-omniverse"]
GIT_USERNAME = { description = "git username of omniverse", required = true }
GIT_TOKEN = { description = "git access token of omniverse", required = true }
WEBDAV_USER = { description = "webdav user of omniverse", required = true }
WEBDAV_PASSWORD = { description = "webdav password of omniverse", required = true }
RADICALE_PASSWORD = { description = "radicale (CalDAV) password of user nikodem", required = true }
RADICALE_SUBSCRIBER_PASSWORD = { description = "radicale password of user subscriber, used by the calendar-subscriptions CronJob", required = true }
CALENDAR_SUBSCRIPTIONS = { description = "calendar-subscriptions CronJob feeds, one `<name> <url> [<display name>]` line each, synced read-only into Radicale as nikodem/sub-<name>", required = true }

[profiles."dijkstra-shani"]
GH_TOKEN = { description = "fine-grained GitHub PAT for shani agents (selected repos; Contents RW, Pull requests RW, Metadata R)", required = true }

[profiles."dijkstra-velero"]
ACCESS_KEY_ID = { description = "Garage access key id of Velero, `GK` + 24 hex (printf 'GK%s' \"$(openssl rand -hex 12)\"); input of CLOUD and GARAGE_ENV", required = true }
SECRET_ACCESS_KEY = { description = "Garage secret key of Velero, 64 hex (printf %s \"$(openssl rand -hex 32)\"); input of CLOUD and GARAGE_ENV", required = true }
CLOUD = { description = "Velero credentials file (AWS INI) of its Garage key", composed = "[default]\naws_access_key_id = ${ACCESS_KEY_ID}\naws_secret_access_key = ${SECRET_ACCESS_KEY}\n" }
GARAGE_ENV = { description = "env file of the Garage server on regis (read by host regis via secrets.garage_env.profile): creates Velero's key at startup", composed = "GARAGE_DEFAULT_ACCESS_KEY=${ACCESS_KEY_ID}\nGARAGE_DEFAULT_SECRET_KEY=${SECRET_ACCESS_KEY}\n" }

[profiles."dijkstra-webdav"]
USER = { description = "books webdav user", required = true }
PASSWORD = { description = "books webdav password", required = true }

[profiles."dijkstra-wireguard"]
WIREGUARD_PRIVATE_KEY = { description = "WireGuard server private key (wg genkey)", required = true }
MULLVAD_PRIVATE_KEY = { description = "Mullvad WireGuard private key of the wireguard pod egress (wg genkey, registered as a device on the Mullvad account)", required = true }
MULLVAD_ADDRESS = { description = "IPv4 address Mullvad assigned to that key, e.g. 10.64.1.2/32", required = true }

[profiles.yenn]
HOST_SSH_ED25519_PRIV = { description = "yenn ssh host private key (ssh-keygen -t ed25519)", required = true }
USERS_NIKODEM_PASSWORD = { description = "nikodem plain password, hashed with mkpasswd by secrets-build", required = true }
USERS_NIKODEM_SSH_ID_ED25519 = { description = "nikodem ssh private key", required = true }
WIREGUARD_PRIVATE_KEY = { description = "yenn WireGuard private key (peer 10.13.13.130)", required = true }

[profiles.geralt]
HOST_SSH_ED25519_PRIV = { description = "geralt ssh host private key (ssh-keygen -t ed25519)", required = true }
USERS_MAINTENANCE_PASSWORD = { description = "maintenance plain password, hashed with mkpasswd by secrets-build", required = true }

[profiles.roach]
HOST_SSH_ED25519_PRIV = { description = "roach ssh host private key (ssh-keygen -t ed25519)", required = true }
USERS_MAINTENANCE_PASSWORD = { description = "maintenance plain password, hashed with mkpasswd by secrets-build", required = true }
K3S_TOKEN = { description = "k3s token, generate with `k3s token create`", required = true }

[profiles.regis]
HOST_SSH_ED25519_PRIV = { description = "regis ssh host private key (ssh-keygen -t ed25519)", required = true }
USERS_MAINTENANCE_PASSWORD = { description = "maintenance plain password, hashed with mkpasswd by secrets-build", required = true }
K3S_TOKEN = { description = "k3s token, generate with `k3s token create`", required = true }
GARAGE_RPC_SECRET = { description = "Garage RPC secret of regis, 32 random bytes as hex without trailing newline (printf %s \"$(openssl rand -hex 32)\")", required = true }

[profiles.triss]
HOST_SSH_ED25519_PRIV = { description = "triss ssh host private key (ssh-keygen -t ed25519)", required = true }
USERS_MAINTENANCE_PASSWORD = { description = "maintenance plain password, hashed with mkpasswd by secrets-build", required = true }
K3S_TOKEN = { description = "k3s token, generate with `k3s token create`", required = true }
